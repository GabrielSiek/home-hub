[package]
name = "tvl-server"
description = "The TV Launcher home server: household state and integrations, and the relay between the house's screens"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tvl-server"
path = "src/main.rs"

[dependencies]
tvl-kit.workspace = true
tvl-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
tracing.workspace = true
reqwest.workspace = true
axum.workspace = true
tower-http.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
time.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
urlencoding.workspace = true
# Smart home on the home network: the Tuya LAN protocol (AES-ECB/GCM, HMAC, CRC32 frames) and
# eWeLink's LAN mode (AES-CBC with an md5 key).
aes.workspace = true
aes-gcm.workspace = true
cbc.workspace = true
md-5.workspace = true
crc32fast.workspace = true
hmac.workspace = true
# The import: the old .env files, and the bundle carried from a TV PC to the server.
dotenvy.workspace = true
zip.workspace = true
qrcode.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true

[target.'cfg(windows)'.dependencies]
# Runs as a Windows service (registered by `tvl-server install`).
windows-service = "0.8"
