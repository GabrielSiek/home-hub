# Each push to main that touches the server or the companion: GitHub builds and tests them, then the
# server (a self-hosted runner, labelled `home-hub`) swaps the new build into /opt/tvl-server and
# restarts the `tvl-server` service. The household's data and keys stay on the server
# (/var/lib/tvl-server); nothing secret goes through GitHub.
# Setting the server up for this: docs/OPERATIONS.md, "Deploys on push".
#
# Pushes to linux-server only build and test (no deploy), which also leaves the build to download.
name: Deploy server

on:
  push:
    branches: [main, linux-server]
    paths:
      - "crates/**"
      - "apps/companion/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "scripts/deploy-server.sh"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cutting it off mid-swap.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # An LTS no newer than the server's: the binary needs a glibc as old as the one it's built on.
    runs-on: ubuntu-24.04
    env:
      # .cargo/config.toml points target-dir at the dev PC's C:\TVLauncher\build; keep it in the
      # workspace here so the cache finds it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Test the crates
        run: cargo test --locked
        env:
          TZ: America/Sao_Paulo

      - name: Build the server
        run: cargo build --release --locked -p tvl-server

      - name: Build the companion
        run: |
          npm ci
          npm run companion:build

      - name: Gather the deploy
        run: |
          mkdir deploy
          cp "$CARGO_TARGET_DIR/release/tvl-server" deploy/
          cp -r apps/companion/dist deploy/companion
          cp scripts/deploy-server.sh deploy/

      - uses: actions/upload-artifact@v4
        with:
          name: tvl-server
          path: deploy
          retention-days: 14

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, home-hub]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tvl-server
          path: deploy

      - name: Swap it in and restart the service
        run: bash deploy/deploy-server.sh deploy "$GITHUB_SHA"
