<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Touch only: no pinch zoom; viewport-fit lets the page run under the status bar and home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- "Add to Home Screen" runs it full screen, the status bar over the page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TV Launcher" />
    <meta name="theme-color" content="#0c0c14" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-256.png" />
    <title>TV Launcher</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0c14; }
      #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; color: #8a8a94; font: 15px sans-serif; }
    </style>
    <script>
      // Plain old JavaScript on purpose: it runs even where the app can't. When the app fails to
      // start (an old Safari, a bug), the error shows on the page and in the launcher's log.
      (function () {
        function report(msg) {
          var box = document.getElementById('boot-error');
          if (!box) {
            box = document.createElement('pre');
            box.id = 'boot-error';
            box.style.cssText =
              'position:fixed;left:12px;right:12px;bottom:12px;z-index:999;margin:0;padding:12px;border-radius:12px;' +
              'background:#3a1416;color:#ffd7d8;font:12px/1.4 monospace;white-space:pre-wrap;max-height:40%;overflow:auto';
            (document.body || document.documentElement).appendChild(box);
          }
          box.textContent += msg + '\n';
          try {
            var x = new XMLHttpRequest();
            x.open('POST', '/api/client_log');
            x.setRequestHeader('Content-Type', 'application/json');
            x.send(JSON.stringify({ message: msg, agent: navigator.userAgent }));
          } catch (e) {}
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            // A broken picture isn't a failure; a script or style sheet that didn't load is.
            if (t && t !== window && t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') return;
            if (t && t !== window) return report('Could not load ' + (t.src || t.href));
            var where = e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : '';
            report((e.message || 'Error') + where + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="boot">Loading…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
