[package]
name = "tvl-kit"
description = "Plumbing shared by the TV Launcher home server and the TV app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
reqwest.workspace = true
urlencoding.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
tokio.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
# The local time zone's rules, from Windows (same version the TV app builds).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[target.'cfg(not(windows))'.dependencies]
# The local time zone's rules, from the system's tzdata.
jiff = "0.2"
